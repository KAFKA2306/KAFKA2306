[project]
name = "kafka-youtube-music-mcp"
version = "0.1.0"
description = "Local MCP server for YouTube playlist management via the official YouTube Data API v3"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2,<3",
  "google-api-python-client>=2,<3",
  "google-auth-oauthlib>=1,<2",
  "google-auth-httplib2>=0.2,<1",
]

[tool.uv]
package = false
